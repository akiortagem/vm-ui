name: Build Windows

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows release
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      MEDIA_SERVER_URL: ${{ vars.MEDIA_SERVER_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate API base URL
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) {
            throw 'Repository variable API_BASE_URL must be configured for release builds.'
          }

          $uri = $null
          if (-not [Uri]::TryCreate($env:API_BASE_URL, [UriKind]::Absolute, [ref]$uri) -or
              $uri.Scheme -notin @('http', 'https') -or
              [string]::IsNullOrWhiteSpace($uri.Host) -or
              -not [string]::IsNullOrEmpty($uri.UserInfo) -or
              -not [string]::IsNullOrEmpty($uri.Query) -or
              -not [string]::IsNullOrEmpty($uri.Fragment)) {
            throw 'Repository variable API_BASE_URL must be an absolute HTTP(S) base URL without credentials, a query, or a fragment.'
          }

      - name: Validate media server URL
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MEDIA_SERVER_URL)) {
            throw 'Repository variable MEDIA_SERVER_URL must be configured for release builds.'
          }

          $uri = $null
          if (-not [Uri]::TryCreate($env:MEDIA_SERVER_URL, [UriKind]::Absolute, [ref]$uri) -or
              $uri.Scheme -notin @('http', 'https') -or
              [string]::IsNullOrWhiteSpace($uri.Host) -or
              -not [string]::IsNullOrEmpty($uri.UserInfo) -or
              -not [string]::IsNullOrEmpty($uri.Query) -or
              -not [string]::IsNullOrEmpty($uri.Fragment)) {
            throw 'Repository variable MEDIA_SERVER_URL must be an absolute HTTP(S) base URL without credentials, a query, or a fragment.'
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            "--dart-define=API_BASE_URL=$env:API_BASE_URL" `
            "--dart-define=MEDIA_SERVER_URL=$env:MEDIA_SERVER_URL"

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: vm-ui-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Package Windows release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $archive = "vm-ui-windows-x64-$env:RELEASE_TAG.zip"
          Compress-Archive `
            -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath $archive

      - name: Attach Windows build to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload $env:RELEASE_TAG `
            "vm-ui-windows-x64-$env:RELEASE_TAG.zip" `
            --clobber
